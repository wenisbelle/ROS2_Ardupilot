# Default parameters of drone_commander (overridden by the launch: name, id, origin_*)
/**:
  ros__parameters:
    setpoint_rate: 20.0           # Hz, GUIDED targets sent to MAVROS
    state_rate: 10.0              # Hz, /<name>/state and map -> <name>/odom TF
    velocity_timeout: 0.5         # s without cmd/velocity -> hold position
    max_horizontal_speed: 10.0    # m/s (clamp of cmd/velocity)
    max_vertical_speed: 3.0       # m/s
    max_yaw_rate: 1.5             # rad/s
    auto_guided: false            # true: a command switches an ARMED drone to GUIDED automatically
    request_streams: true         # ask the FCU for the MAVLink streams through MAVROS
    publish_tf: true              # map -> <name>/odom -> <name>/base_link
